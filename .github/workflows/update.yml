name: Update league data

on:
  schedule:
    - cron: "0 21,22,23 * * 0"
    - cron: "0 0,1,2,3 * * 1"
    - cron: "0 4 * * 2"
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-league
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Yahoo league data
        env:
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        run: python scripts/fetch_yahoo.py

      - name: Commit and push updated data
        run: |
          git config user.name "nfl-unlocked-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: automated update $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
