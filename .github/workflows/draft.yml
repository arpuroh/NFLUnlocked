name: Draft and projections

# Two jobs in one file, both manual.
#
#   fetch_draft.py     re-reads the public Yahoo draft-results page into data/draft.json
#   project_draft.py   re-scores the Sleeper projection feed under this league's rules
#                      into data/projections.json, which is what the power rankings use
#
# The draft is done, so nothing here runs on a schedule any more. Refresh the
# projections whenever they start to look stale; once a week in season is plenty.
#
# NOTE: do not put `secrets.*` inside a step-level `if:`. The secrets context is
# not available there, GitHub rejects the entire workflow file, and every push
# then shows up as a failed run with no jobs in it. Read the secret into `env`
# and test the variable in the shell instead, the way the grades step does below.
on:
  workflow_dispatch:
    inputs:
      projections:
        description: "Refresh player projections (recomputes the power rankings)"
        type: boolean
        default: true
      grades:
        description: "Rewrite draft_grades.json with the Claude API (needs the ANTHROPIC_API_KEY secret)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-league
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scrape draft results
        run: python scripts/fetch_draft.py

      - name: Refresh projections
        if: ${{ inputs.projections }}
        run: python scripts/project_draft.py --refresh

      - name: Rewrite draft grades
        if: ${{ inputs.grades }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY is not set on this repository, skipping the grade rewrite."
            exit 0
          fi
          python scripts/generate_draft_grades.py

      - name: Commit and push
        run: |
          git config user.name "nfl-unlocked-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "data: draft and projections $(date -u '+%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main || true
            git push
          fi
